<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact · Prevayl</title>
  <link rel="stylesheet" href="../css/site.css" />
</head>
<body>
  <header class="site-header">
    <div class="inner">
      <a href="../index.html" class="logo">
        <svg width="32" height="32" viewBox="0 0 40 40" fill="none"><circle cx="20" cy="12" r="5" fill="#C9A84C"/><path d="M20 17 L20 28" stroke="#C9A84C" stroke-width="2.5" stroke-linecap="round"/></svg>
        PREVAYL
      </a>
      <nav class="nav-desktop">
        <a href="platform.html">Platform</a>
        <a href="solutions.html">Solutions</a>
        <a href="pricing.html">Pricing</a>
        <a href="contact.html" class="active">Contact</a>
      </nav>
      <div class="header-actions">
        <a href="contact.html" class="btn btn-gold btn-sm">Get Started</a>
        <button class="mobile-toggle" id="mobile-toggle" aria-label="Menu"><span></span><span></span><span></span></button>
      </div>
    </div>
  </header>
  <nav class="mobile-nav" id="mobile-nav">
    <a href="contact.html">Contact</a>
  </nav>
  <main>
    <section class="page-hero">
      <div class="container" style="max-width:36rem">
        <h1 class="font-display">Get started in under 10 minutes.</h1>
        <p class="lead">Tell us your volume and your worst lane. We’ll show you what Prevayl does with them.</p>
      </div>
    </section>
    <section class="section" style="padding-top:0">
      <div class="container" style="max-width:32rem">
        <form class="glass" style="border-radius:1rem;padding:2rem" onsubmit="event.preventDefault();alert('Demo form — wire to Formspree, Resend, or your API.');">
          <div style="margin-bottom:1.25rem">
            <label style="display:block;font-size:0.8rem;color:var(--prevayl-muted);margin-bottom:0.4rem">Name</label>
            <input required name="name" style="width:100%;padding:0.75rem 1rem;border-radius:0.5rem;border:1px solid var(--prevayl-navy-4);background:var(--prevayl-navy);color:var(--prevayl-soft);font:inherit" />
          </div>
          <div style="margin-bottom:1.25rem">
            <label style="display:block;font-size:0.8rem;color:var(--prevayl-muted);margin-bottom:0.4rem">Work email</label>
            <input required type="email" name="email" style="width:100%;padding:0.75rem 1rem;border-radius:0.5rem;border:1px solid var(--prevayl-navy-4);background:var(--prevayl-navy);color:var(--prevayl-soft);font:inherit" />
          </div>
          <div style="margin-bottom:1.25rem">
            <label style="display:block;font-size:0.8rem;color:var(--prevayl-muted);margin-bottom:0.4rem">Role</label>
            <select name="role" style="width:100%;padding:0.75rem 1rem;border-radius:0.5rem;border:1px solid var(--prevayl-navy-4);background:var(--prevayl-navy);color:var(--prevayl-soft);font:inherit">
              <option>Broker</option>
              <option>Carrier / Owner-operator</option>
              <option>Dealer</option>
              <option>Auction / Wholesale</option>
            </select>
          </div>
          <div style="margin-bottom:1.5rem">
            <label style="display:block;font-size:0.8rem;color:var(--prevayl-muted);margin-bottom:0.4rem">Monthly volume (cars)</label>
            <input name="volume" placeholder="e.g. 50" style="width:100%;padding:0.75rem 1rem;border-radius:0.5rem;border:1px solid var(--prevayl-navy-4);background:var(--prevayl-navy);color:var(--prevayl-soft);font:inherit" />
          </div>
          <button type="submit" class="btn btn-gold btn-md" style="width:100%">Request access / Book demo</button>
          <p style="margin-top:1rem;font-size:0.75rem;color:var(--prevayl-muted);text-align:center">No card required. Free for carriers. Always.</p>
        </form>
      </div>
    </section>
  </main>
  <footer class="site-footer"><div class="container"><div class="footer-bottom" style="border:none;padding-top:0"><span>© 2026 Prevayl Inc.</span><a href="../index.html" style="color:var(--prevayl-gold)">← Home</a></div></div></footer>
  <script src="../js/site.js"></script>
</body>
</html>
